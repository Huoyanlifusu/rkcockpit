server {
    listen 80;
    server_name @@SERVER_NAME@@;
    access_log off;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name @@SERVER_NAME@@;
    ssl_certificate @@CERT_FILE@@;
    ssl_certificate_key @@KEY_FILE@@;
    ssl_protocols TLSv1.2 TLSv1.3;
    # API paths contain device identifiers and log sources. Runtime metrics
    # and mutation audit remain enabled; high-volume raw URI logging is not.
    access_log off;

    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;

    client_max_body_size 1m;

    location ~ ^/api/fs/[^/]+/upload$ {
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location ~ ^/api/(monitor/[^/]+/stream|logcenter/[^/]+/stream|agent/sessions/[^/]+/stream)$ {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 45s;
        proxy_send_timeout 5s;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
