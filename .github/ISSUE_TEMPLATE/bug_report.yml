name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the unexpected behavior.
      placeholder: Describe the bug...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - RK3588
        - RK3576
        - RK3568
        - RV1126
        - Other
  - type: input
    id: version
    attributes:
      label: rkcockpit version