name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? Why do you need it?
      placeholder: I can't currently...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should happen instead?
      placeholder: It would be great if...
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you've already tried?
  - type: dropdown
    id: device
    attributes:
      label: Device (leave as-is if not hardware-related)
      options:
        - Not hardware-related
        - RK3588
        - RK3576
        - RK3568
        - RV1126
        - Other